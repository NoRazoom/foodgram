version: '3.3'

volumes:
  staticfiles:
    name: foodgram_staticfiles
  mediafiles:
    name: foodgram_mediafiles
  pg_data:
    name: foodgram_pg_data

services:
  db:
    image: postgres:14.15-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    image: norazoom/foodgram_backend
    volumes:
      - staticfiles:/app/staticfiles/
      - mediafiles:/app/media/
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: norazoom/foodgram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - staticfiles:/frontend_static

  nginx:
    image: norazoom/foodgram_nginx
    ports:
      - "8000:80"
    volumes:
      - staticfiles:/staticfiles/
      - mediafiles:/media/
      # - /d/dev/foodgram/docs/:/usr/share/nginx/html/api/docs/
    depends_on:
      - frontend
      - backend